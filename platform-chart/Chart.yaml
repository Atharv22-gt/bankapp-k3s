apiVersion: v2
name: bankapp-platform
description: BankApp + MySQL + ELK logging, all in one chart
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: elasticsearch
    version: "8.5.1"
    repository: "https://helm.elastic.co"
    condition: elasticsearch.enabled
  - name: filebeat
    version: "8.5.1"
    repository: "https://helm.elastic.co"
    condition: filebeat.enabled